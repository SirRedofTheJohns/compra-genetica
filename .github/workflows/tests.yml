name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: CLI smoke test
        run: compra-genetica --catalog data/in/small-3s-4p-f1_10-q1_4-random_catalog.xlsx --products "Alfombras,Pasta de dientes" --fuel 2 --seed 0
